<svg xmlns="http://www.w3.org/2000/svg" width="720" height="900" viewBox="0 0 720 900" role="img" aria-labelledby="title desc">
  <title id="title">折叠屏设备背面</title>
  <desc id="desc">折叠状态的手机背面，竖向三摄像头和右侧铰链清晰可见。用于原型的设备示意图。</desc>
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1"><stop stop-color="#f4f5f6"/><stop offset="1" stop-color="#e4e8e7"/></linearGradient>
    <linearGradient id="frame" x1="0" y1="0" x2="1" y2="0"><stop stop-color="#848b8f"/><stop offset="0.08" stop-color="#d1d5d5"/><stop offset="0.48" stop-color="#626b70"/><stop offset="0.91" stop-color="#d8dddd"/><stop offset="1" stop-color="#6c757b"/></linearGradient>
    <linearGradient id="back" x1="0" y1="0" x2="0.8" y2="1"><stop stop-color="#bdc8c7"/><stop offset="0.54" stop-color="#929fa1"/><stop offset="1" stop-color="#73878b"/></linearGradient>
    <linearGradient id="screen" x1="0" y1="0" x2="1" y2="1"><stop stop-color="#334b4c"/><stop offset="0.55" stop-color="#5b8c87"/><stop offset="1" stop-color="#d2c3af"/></linearGradient>
    <linearGradient id="warm" x1="0" y1="0" x2="1" y2="1"><stop stop-color="#ffdab9"/><stop offset="0.55" stop-color="#ecab88"/><stop offset="1" stop-color="#b37871"/></linearGradient>
    <radialGradient id="lens"><stop stop-color="#426777"/><stop offset="0.33" stop-color="#172938"/><stop offset="0.6" stop-color="#102029"/><stop offset="0.82" stop-color="#050b12"/><stop offset="1" stop-color="#26333c"/></radialGradient>
    <filter id="shadow" x="-40%" y="-25%" width="180%" height="160%"><feDropShadow dx="0" dy="18" stdDeviation="20" flood-color="#374b4b" flood-opacity="0.16"/></filter>
    
  </defs>
  <rect width="720" height="900" fill="url(#bg)"/>
  <ellipse cx="359" cy="736" rx="214" ry="20" fill="#b9c2c0" opacity="0.2"/>
  <g filter="url(#shadow)">
    <rect x="471" y="157" width="24" height="552" rx="12" fill="url(#frame)"/>
    <rect x="231" y="153" width="250" height="560" rx="31" fill="url(#frame)"/>
    <rect x="237" y="159" width="237" height="548" rx="26" fill="url(#back)"/>
    <path d="M251 196V667" stroke="#e2e9e5" stroke-width="2" opacity="0.25"/>
    <rect x="256" y="182" width="67" height="188" rx="33" fill="#67777c" stroke="#c5d0ce" stroke-width="2"/>
    <g fill="url(#lens)" stroke="#222e35" stroke-width="6">
      <circle cx="289" cy="217" r="24"/><circle cx="289" cy="276" r="24"/><circle cx="289" cy="335" r="24"/>
    </g>
    <g fill="#d2e9f0" opacity="0.3"><circle cx="281" cy="209" r="5"/><circle cx="281" cy="268" r="5"/><circle cx="281" cy="327" r="5"/></g>
    <circle cx="345" cy="217" r="9" fill="#e4e6d6" stroke="#85938f" stroke-width="2"/>
    <path d="M486 188V679" stroke="#eff2ee" stroke-width="2" opacity="0.7"/>
    <rect x="227" y="283" width="4" height="49" rx="2" fill="#788388"/>
    <rect x="227" y="357" width="4" height="29" rx="2" fill="#788388"/>
  </g>
  <text x="360" y="834" text-anchor="middle" font-family="-apple-system, BlinkMacSystemFont, 'PingFang SC', 'Microsoft YaHei', sans-serif" font-size="20" fill="#75817f">设备示意图 · Illustration</text>
</svg>
