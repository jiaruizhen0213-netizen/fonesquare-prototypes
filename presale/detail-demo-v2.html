<!doctype html>
<html lang="zh-CN"><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>商品详情 · 底部预订 Demo</title><link rel="stylesheet" href="style.css"><link rel="stylesheet" href="wholesale.css"><style>
.product-art{height:210px}.product-art>svg{height:180px}.demo-note{margin-top:16px}.sheet input{width:80px;padding:8px;border:1px solid #ddd;border-radius:8px}.demo-channels{display:flex;gap:10px;margin:15px 0}.demo-channels button{flex:1;padding:12px;border:1px solid #ddd;border-radius:10px}.screen .product-info .price{text-align:left}.sheet .primary{background:#ff5100;color:#fff}.demo-summary{white-space:pre-line;background:#f7f8fa;padding:12px;border-radius:10px;font-size:13px}.close-btn{margin-top:8px}@media(max-width:650px){.product-art{height:225px}.product-art>svg{height:200px}.product-info{padding-top:12px}.reservation-card{margin-top:14px}}
.inventory-pair{display:grid;grid-template-columns:1fr 1fr;margin-top:16px;padding:14px 0 0;border-top:1px solid #f0f0f0}.inventory-pair>div{display:flex;align-items:center;gap:9px;font-size:12px;color:#8b9099}.inventory-pair>div+div{border-left:1px solid #eceef1;padding-left:20px}.inventory-pair strong{font-size:18px;color:#4c5968}.inventory-pair>div+div strong{color:#ff5100}.inventory-pair small{font-size:11px;font-weight:400}.original-actions{gap:5px;padding:12px 8px}.original-actions .utility{width:32px;font-size:10px}.original-actions .add-cart,.original-actions .buy-now,.original-actions .reserve-now{min-width:0;flex:1;height:44px;padding:0 3px;font-size:12px;white-space:nowrap}.original-actions .reserve-now{border:1px solid #ff5100;background:#fff1e8;color:#ff5100;border-radius:24px;font-weight:600}.original-actions button:disabled{background:#eee;color:#aaa;border-color:#eee}</style></head><body><div class="workspace"><aside class="side"><div class="eyebrow">FONESQUARE · DETAIL DEMO</div><h1>购买与预订<br>并排呈现</h1><p>图片下方并排展示现货库存与可预订台数，底部增加“立即预订”。</p><div class="lab"><h2>商品详情页 Demo</h2><p>保留原有入口，立即购买与立即预订相邻。可切换颜色、查看图片，并体验选择预订数量。</p><label for="scenario">查看不同状态</label><select id="scenario"><option value="W001">现货 + 可预订</option><option value="W003">仅可预订</option><option value="W004">仅现货</option><option value="W005">缺价，联系销售询价</option></select><p class="demo-note">独立演示页面，使用模拟数据。</p></div></aside><div class="preview-wrap"><div class="preview-caption">FoneSquare App · 商品详情</div><div class="phone"><div class="statusbar"><b>9:41</b><span>▮▮▮　▰</span></div><main class="screen" id="screen"></main><footer id="footer"></footer><div id="overlay"></div><div id="toast" class="toast hidden" role="status"></div></div></div></div><script src="../wholesale-catalog.js"></script><script src="detail-demo-v2.js"></script></body></html>
